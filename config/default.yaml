# Global configuration
global:
  seed: 42
  logging:
    level: INFO
    format: "[%(levelname)s] %(name)s: %(message)s"

simulation:
  default_n_paths: 5000
  default_time_steps: 6
  default_horizon_years: 1.0

credit_risk:
  stochastic_params:
    lgd_volatility: 0.20         # Volatility for stochastic LGD (Beta distribution)
    pd_volatility: 0.35          # Volatility for stochastic PD (log-normal)
    use_stochastic_lgd: true     # Enable/disable stochastic LGD
    use_stochastic_pd: true      # Enable/disable stochastic PD
  
  volatility:
    use_term_structure: true     # Enable time-varying volatility
    vol_short: 0.30              # Short-term volatility
    vol_long: 0.18               # Long-term equilibrium volatility
    mean_reversion: 0.40         # Speed of mean reversion
  
  pricing:
    use_proper_models: true      # Use Black-Scholes/DV01 vs stylized linear+gamma

  # NEW SECTION in default.yaml:

correlation:
  # Method: "static", "rolling", "regime_switching"
  method: "regime_switching"
  
  # Rolling window parameters
  rolling_window: 252  # trading days
  
  # Regime switching parameters
  stress_multiplier: 1.5  # vol_short / vol_long threshold
  short_window: 20
  long_window: 60
  
  # Regime-specific correlation matrices
  regimes:
    normal:
      Market_Credit: 0.30
      Market_OpRisk: 0.10
      Credit_OpRisk: 0.20
    
    stress:
      Market_Credit: 0.65  # Contagion effect
      Market_OpRisk: 0.35
      Credit_OpRisk: 0.45
  
  # Static fallback (if dynamic estimation fails)
  static:
    Market_Credit: 0.30
    Market_OpRisk: 0.10
    Credit_OpRisk: 0.20

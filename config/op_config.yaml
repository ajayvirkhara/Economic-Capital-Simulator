# Operational Risk Configuration
op_risk:
  frequency:
    dist: poisson
    lambda: 0.5
    multiplier: 5
    data_path: "econ_capital/op_risk/data/freq_data.csv"

  severity:
    dist: lognormal
    mu: 1
    mu_shift: 0.05
    scale_multiplier: 0.05
    sigma: 2
    data_path: "econ_capital/op_risk/data/sev_data.csv"
    GPD_THRESHOLD: 150000
    use_fitted: true

  scenarios:
    cyber_attack:
      probability: 0.01
      impact: 1000000
    fraud:
      probability: 0.02
      impact: 500000
    system_outage:
      probability: 0.03
      impact: 200000

  insurance:
    enabled: false
    coverage: 50000
    deductible: 10000

  stress_tests:
    extreme_event:
      severity_multiplier: 10
      frequency_multiplier: 5

  simulation:
    num_simulations: 100000
    confidence_level: 0.999
    random_seed: 40
    VAR_LEVELS: [0.95, 0.99, 0.995, 0.999]
    ES_ALPHA: 0.995

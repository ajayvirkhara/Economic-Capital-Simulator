credit_risk:
  n_paths: 5000
  seed: 42

  # Correlation structure used in credit factor simulation
  credit_factor_correlation:
    - [1.0, 0.2, 0.2]
    - [0.2, 1.0, 0.2]
    - [0.2, 0.2, 1.0]

  # WWR sensitivity multiplier for adjust_for_wwr()
  wwr_corr: 0.2

  # Exposure engine parameters
  exposure_engine:
    pfe_quantile: 0.975
    alpha_factor: 1.4 # Alpha factor (Basel: 1.4 for EAD = alpha × EPE)

  # Default PD clipping for hazard-rate models
  pd_min: 1e-6
  pd_max: 0.30

  # LGD assumptions
  lgd_floor: 0.1
  lgd_ceiling: 0.75

  # Credit factor simulation
  market_model:
    vol: 0.20
    mean_reversion: 0.00
    shock_scale: 0.10

  positions_csv: "econ_capital/credit_risk/data/counterparty_exposures.csv"
  csa_threshold: 1000000
  csa_mta: 500000

  horizon_steps: 51

  stochastic_params:
    lgd_volatility: 0.20         # Volatility for stochastic LGD (Beta distribution)
    pd_volatility: 0.35          # Volatility for stochastic PD (log-normal)
    use_stochastic_lgd: true     # Enable/disable stochastic LGD
    use_stochastic_pd: true      # Enable/disable stochastic PD
  
  volatility:
    use_term_structure: true     # Enable time-varying volatility
    vol_short: 0.30              # Short-term volatility
    vol_long: 0.18               # Long-term equilibrium volatility
    mean_reversion: 0.40         # Speed of mean reversion
  
  pricing:
    use_proper_models: true      # Use Black-Scholes/DV01 vs stylized linear+gamma
